<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONETWL — EDITORIAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* 防止 FOUC (Flash of Unstyled Content) 导致的跳动 */
      html {
        width: 100%;
        scroll-behavior: auto;
        overflow-x: hidden;
      }

      body {
        width: 100%;
        min-height: 100%;
        font-family: 'Cormorant Garamond', Georgia, serif;
        background: #0a0a0a;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        /* 初始隐藏防止渲染闪烁，JS 加载后显示 */
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #root.ready {
        opacity: 1;
      }
    </style>

    <!--
      防止 FOUC（页面渲染闪烁）：先隐藏 #root，
      待 React 挂载后由 useScrollProgress hook 恢复滚动位置并显示内容
    -->
    <script>
      (function() {
        const showRoot = () => {
          const root = document.getElementById('root');
          if (root) root.classList.add('ready');
        };
        // 主要时机：load 事件后稍等 React 渲染
        window.addEventListener('load', () => setTimeout(showRoot, 100));
        // 兜底：避免网络异常时页面永远不显示
        setTimeout(showRoot, 3000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
